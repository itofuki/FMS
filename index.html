<!-- index.html -->

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#1e293b">
    <!-- 描画前にテーマを適用して、読み込み時のちらつき（ライト→ダーク）を防ぐ。
         Mantine の colorSchemeManager と同じ localStorage キーを読む -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('mantine-color-scheme-value');
          var dark = v === 'dark' || ((!v || v === 'auto') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var scheme = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1e293b');
        } catch (e) {}
      })();
    </script>
    <!-- viewport-fit=cover: iPhone のホーム画面のアプリで、下のホームバーの分の余白（safe-area-inset）を使えるようにする -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
